<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automotive Assistant</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- LaunchDarkly Client-Side SDK -->
    <script src="https://unpkg.com/launchdarkly-js-client-sdk@3"></script>  
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        AppCanvas: '#f2f5f8',
                        GlassCard: 'rgba(255, 255, 255, 0.65)',
                        UserBubble: '#ecf2f8',
                        FuturisticBlue: '#008cff',
                        CyanGlow: '#00d7ff',
                        SoftBorder: 'rgba(255, 255, 255, 0.8)'
                    },
                    boxShadow: {
                        'glass': '0 12px 24px -4px rgba(0, 0, 0, 0.04), 0 8px 16px -4px rgba(0, 140, 255, 0.08)',
                        'cyan-glow': '0 0 12px rgba(0, 215, 255, 0.45)'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-AppCanvas text-slate-800 font-sans min-h-screen flex flex-col antialiased relative selection:bg-FuturisticBlue selection:text-white" 
      x-data="mechanicApp()" x-init="initApp()">

    <!-- Ambient background glow -->
    <div class="absolute top-0 left-0 right-0 h-72 bg-gradient-to-b from-[rgba(0,215,255,0.12)] to-transparent pointer-events-none z-0"></div>

    <!-- Main Navigation Bar -->
    <header class="bg-FuturisticBlue text-white shadow-md sticky top-0 z-20 flex items-center justify-between px-4 py-3">
        <button @click="showHistory = true" class="p-2 hover:bg-white/10 rounded-lg transition">
            <svg class="w-6 h-6 font-bold" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <h1 class="text-base font-bold tracking-wide">AUTOMOTIVE ASSISTANT</h1>
        <button @click="newConversation()" class="p-2 hover:bg-white/10 rounded-lg transition" title="New Conversation">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"></path>
            </svg>
        </button>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col gap-4 relative z-10">

        <!-- Active Vehicle HUD Card -->
        <div class="bg-GlassCard backdrop-blur-md border-[1.5px] border-SoftBorder rounded-xl p-4 shadow-glass flex items-center justify-between">
            <div class="flex flex-col gap-1">
                <span class="text-[10px] font-mono font-semibold text-FuturisticBlue tracking-widest">ACTIVE VEHICLE</span>
                <span class="text-lg font-bold uppercase max-w-[240px]" x-text="carModel ? carModel : 'ADD VEHICLE YEAR, MAKE, MODEL'"></span>
            </div>
            <button @click="promptCarModel()" class="text-[11px] font-mono font-bold text-white bg-FuturisticBlue px-3.5 py-1.5 rounded-md shadow-cyan-glow transition hover:opacity-90">ADD/UPDATE</button>
        </div>

        <!-- Car Mileage / Odometer HUD Card -->
        <div class="bg-GlassCard backdrop-blur-md border-[1.5px] border-SoftBorder rounded-xl p-4 shadow-glass flex items-center justify-between">
            <div class="flex flex-col gap-1">
                <span class="text-[10px] font-mono font-semibold text-FuturisticBlue tracking-widest">CAR ODOMETER (CAR MILES)</span>
                <span class="text-lg font-bold uppercase max-w-[240px]" x-text="carOdometer ? carOdometer : 'ADD CAR MILES / ODOMETER READING'"></span>
            </div>
            <button @click="promptCarOdometer()" class="text-[11px] font-mono font-bold text-white bg-FuturisticBlue px-3.5 py-1.5 rounded-md shadow-cyan-glow transition hover:opacity-90">ADD/UPDATE</button>
        </div>

        <!-- Chat Response / Telemetry Glass Screen -->
        <div class="flex-1 bg-GlassCard backdrop-blur-md border-[1.5px] border-SoftBorder rounded-2xl p-4 shadow-glass flex flex-col h-[380px] overflow-y-auto" id="chat-container">
            <span class="text-[10.5px] font-mono font-semibold text-FuturisticBlue tracking-wider mb-2">INSIGHTS</span>
            
            <template x-if="messages.length === 0 && !isLoading">
                <div class="text-secondary text-sm text-slate-500">
                    Enter symptoms below (e.g., Engine not starting, oil leaks, etc).
                </div>
            </template>

            <div class="flex flex-col gap-4">
                <template x-for="message in messages" :key="message.id">
                    <div class="flex flex-col" :class="message.isUser ? 'items-end' : 'items-start'">
                        <template x-if="message.image">
                            <img :src="message.image" class="max-h-48 rounded-lg mb-2 object-contain border border-SoftBorder shadow-sm" />
                        </template>
                        <div class="text-sm leading-relaxed whitespace-pre-wrap select-text p-3 rounded-xl max-w-[85%]"
                             :class="message.isUser ? 'bg-UserBubble text-FuturisticBlue font-medium border border-SoftBorder' : 'bg-white/80 text-slate-800 shadow-sm border border-SoftBorder'"
                             x-text="message.text"></div>
                    </div>
                </template>

                <template x-if="isLoading">
                    <div class="flex flex-col items-center justify-center my-6 gap-2">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-FuturisticBlue"></div>
                        <span class="text-xs font-mono font-bold text-FuturisticBlue tracking-wider">Analyzing Telemetry...</span>
                    </div>
                </template>
            </div>
        </div>

        <!-- Image Preview Indicator -->
        <template x-if="selectedImage">
            <div class="flex items-center gap-2 bg-GlassCard p-2 rounded-xl border border-SoftBorder">
                <img :src="selectedImage" class="w-12 h-12 object-cover rounded-lg border border-SoftBorder">
                <span class="text-xs font-mono text-slate-600 flex-1 truncate">Image attached</span>
                <button @click="selectedImage = null; selectedImageBase64 = null;" class="text-xs text-red-500 font-bold px-2 py-1">Remove</button>
            </div>
        </template>

        <!-- Input Field & Action Buttons -->
<div class="flex items-center gap-3">
    <!-- Bind x-show to the LaunchDarkly state variable -->
    <label x-show="showImageUpload" class="cursor-pointer bg-FuturisticBlue text-white w-12 h-12 flex items-center justify-center rounded-xl shadow-sm transition hover:opacity-90 shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"></path>
        </svg>
        <input type="file" accept="image/*" @change="handleImageSelect" class="hidden">
    </label>

    <input type="text" x-model="userQuery" @keydown.enter="sendMessage()" placeholder="Describe car symptoms or ask a question..." 
           class="flex-1 bg-GlassCard backdrop-blur-md border-[1.5px] border-SoftBorder rounded-xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-FuturisticBlue shadow-glass">

    <button @click="sendMessage()" class="bg-FuturisticBlue text-white w-12 h-12 flex items-center justify-center rounded-xl shadow-sm transition hover:opacity-90 shrink-0">
        <svg class="w-5 h-5 font-bold" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"></path>
        </svg>
    </button>
</div>

    </main>

    <!-- Import Google Gen AI SDK as module and expose globally -->
    <script type="module">
        import { GoogleGenAI } from 'https://esm.run/@google/genai';
        window.GoogleGenAI = GoogleGenAI;
    </script>

    <!-- App Logic Script -->
    <script>

            try {
                    const clientContext = {
                        kind: 'user',
                        key: 'user-123',         // Individual Targeting in dashboard
                        name: 'Ryan',
                        role: 'beta-tester',     // <--- Rule-Based Targeting (e.g. role is beta-tester)
                        plan: 'enterprise'       // <--- Additional optional attribute for rule-based matching
                    };

                    window.ldClient = LDClient.initialize('6acc109d70bb03078c26e5e9', clientContext);
        } catch (e) {
            console.error("LaunchDarkly failed to initialize:", e);
        }

        function mechanicApp() {
            return {
                carModel: '',
                carOdometer: '',
                userQuery: '',
                messages: [],
                isLoading: false,
                showHistory: false,
                selectedImage: null,
                selectedImageBase64: null,
                showImageUpload: false,

             initApp() {
                    this.messages = [];
                    this.carModel = '';
                    this.carOdometer = '';
                    this.scrollToBottom();

                    // Set up listeners using the global window.ldClient safely
                    if (window.ldClient) {
                        window.ldClient.on('ready', () => {
                            this.showImageUpload = window.ldClient.variation('car-image-upload-feature', false);
                        });

                        window.ldClient.on('change:car-image-upload-feature', (current) => {
                            this.showImageUpload = current;
                        });
                    }
                },

                promptCarModel() {
                    const model = prompt("Enter Vehicle Year, Make, Model (e.g., 2018 Honda Civic):", this.carModel);
                    if (model !== null) {
                        this.carModel = model.trim();
                    }
                },

                promptCarOdometer() {
                    const miles = prompt("Enter Current Odometer / Mileage:", this.carOdometer);
                    if (miles !== null) {
                        this.carOdometer = miles.trim();
                    }
                },

                newConversation() {
                    this.messages = [];
                },

                handleImageSelect(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.selectedImage = e.target.result;
                        this.selectedImageBase64 = e.target.result.split(',')[1];

                        // TRACK LD EXPERIMENT METRIC HERE
                        if (window.ldClient) {
                            window.ldClient.track('car-image-uploaded');
                        }
                    };
                    reader.readAsDataURL(file);
                },

                async sendMessage() {
                    if (!this.userQuery.trim() && !this.selectedImageBase64) return;

                    const queryText = this.userQuery.trim();
                    const imageSnapshot = this.selectedImage;
                    const imageBase64Snapshot = this.selectedImageBase64;

                    const userMsg = {
                        id: Date.now(),
                        text: queryText || "[Attached Image for Diagnostic Inspection]",
                        isUser: true,
                        image: imageSnapshot
                    };

                    this.messages.push(userMsg);
                    this.userQuery = '';
                    this.selectedImage = null;
                    this.selectedImageBase64 = null;
                    this.scrollToBottom();

                    this.isLoading = true;

                    try {
                        const ai = new GoogleGenAI({ apiKey: "API Key" });
                        
                        let systemInstruction = "You are an expert At-Home Automotive Mechanic AI Assistant. Help diagnose vehicle symptoms, provide repair advice, explain dashboard warning lights, and guide users through maintenance safely and clearly. Keep initial answers brief. Try to keep it to 3-7 sentences";
                        if (this.carModel) {
                            systemInstruction += ` The user's active vehicle is: ${this.carModel}.`;
                        }
                        if (this.carOdometer) {
                            systemInstruction += ` The vehicle's odometer reading is: ${this.carOdometer}.`;
                        }

                        let parts = [];
                        if (imageBase64Snapshot) {
                            parts.push({
                                inlineData: {
                                    data: imageBase64Snapshot,
                                    mimeType: 'image/jpeg'
                                }
                            });
                        }
                        parts.push({ text: queryText || "Please inspect this image and provide mechanical diagnosis and guidance." });

                        const response = await ai.models.generateContent({
                            model: 'gemini-3.8-flash',
                            contents: parts,
                            config: {
                                systemInstruction: systemInstruction,
                            }
                        });

                        const replyText = response.text || "No diagnostics returned from AI.";

                        const aiMsg = {
                            id: Date.now() + 1,
                            text: replyText,
                            isUser: false,
                            image: null
                        };

                        this.messages.push(aiMsg);
                    } catch (err) {
                        console.error(err);
                        this.messages.push({
                            id: Date.now() + 1,
                            text: `Error connecting to Gemini API: ${err.message}`,
                            isUser: false,
                            image: null
                        });
                    } finally {
                        this.isLoading = false;
                        this.scrollToBottom();
                    }
                },

                scrollToBottom() {
                    setTimeout(() => {
                        const container = document.getElementById('chat-container');
                        if (container) container.scrollTop = container.scrollHeight;
                    }, 50);
                }
            }
        }
    </script>
</body>
</html>
